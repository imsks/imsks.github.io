<html lang="en">

<title>Sachin Kumar Shukla - Brand Kit</title>

  ============================================================
  BRAND-FACING PAGE. Everything a brand needs to decide, in
  one scroll: audience, accounts, packages, proof, process,
  terms, and a pre-filled brief to email.

  EDIT EVERYTHING FROM THE CONFIG BLOCK AT THE BOTTOM OF THIS
  FILE (search for: const CONFIG).
  ============================================================
-->

<style>
:root{
  color-scheme: only light;
  --signal:#E3B505;
  --signal-deep:#C09A00;
  --ink:#14110F;
  --stone:#6E665E;
  --paper:#FAF8F5;
  --line:#DAD3C7;
  --max:1080px;
}

*{box-sizing:border-box}
html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; scroll-padding-top:calc(72px + env(safe-area-inset-top,0px)); }
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Source Serif 4", Georgia, "Times New Roman", serif;
  font-size:17px;
  line-height:1.62;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
img{max-width:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink); outline-offset:3px}

.wrap{max-width:var(--max); margin:0 auto; padding:0 24px}

/* ---------- nav ---------- */
.nav{
  position:sticky; top:0; z-index:50;
  background:var(--ink); color:var(--paper);
  padding-top:env(safe-area-inset-top,0px);
}
.nav-in{display:flex; align-items:center; gap:20px; height:58px; max-width:var(--max); margin:0 auto; padding:0 24px}
.nav-name{font-family:"Archivo",system-ui,sans-serif; font-weight:800; font-size:15px; letter-spacing:-.02em; margin-right:auto}
.nav a{font-family:"Archivo",system-ui,sans-serif; font-size:13.5px; font-weight:500; text-decoration:none; opacity:.78}
.nav a:hover{opacity:1}
.nav a.nav-cta{background:var(--signal); color:var(--ink); opacity:1; font-weight:700; padding:7px 13px; border-radius:2px}
.nav-links{display:flex; gap:18px; align-items:center}

/* ---------- hero ---------- */
.hero{background:var(--signal); border-bottom:2px solid var(--ink); padding:64px 0 0}
.hero h1{
  font-family:"Archivo",system-ui,sans-serif;
  font-weight:800; font-size:clamp(40px,8.4vw,80px); line-height:.94;
  letter-spacing:-.035em; margin:0 0 26px; max-width:16ch;
}
.hero-lede{font-size:clamp(19px,2.4vw,24px); line-height:1.45; max-width:36ch; margin:0 0 36px; font-weight:600}
.hero-rule{height:2px; background:var(--ink); transform-origin:left; margin-bottom:18px}
.hero-meta{
  display:flex; flex-wrap:wrap; gap:4px 34px; padding-bottom:26px;
  font-family:"Archivo",system-ui,sans-serif; font-size:14px; font-weight:500;
}
.hero-meta b{font-weight:800}

/* ---------- section scaffolding ---------- */
.sec{padding:66px 0; border-bottom:1px solid var(--line)}
.sec:last-of-type{border-bottom:0}
.sec-head{margin-bottom:34px; max-width:62ch}
.sec h2{
  font-family:"Archivo",system-ui,sans-serif; font-weight:800;
  font-size:clamp(26px,4vw,38px); letter-spacing:-.03em; line-height:1.05; margin:0 0 12px;
}
.sec h2 .num{color:var(--signal-deep); font-size:.55em; vertical-align:top; margin-right:10px; letter-spacing:0}
.sec-head p{margin:0; color:var(--stone); max-width:58ch}

/* ---------- why ---------- */
.why{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr)); gap:28px; margin-top:38px}
.why-item{border-top:2px solid var(--signal); padding-top:14px}
.why-item h3{font-family:"Archivo",system-ui,sans-serif; font-size:17px; font-weight:800; margin:0 0 6px; letter-spacing:-.01em}
.why-item p{margin:0; color:var(--stone); font-size:16px}

/* ---------- stat strip ---------- */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr)); gap:1px; background:var(--line); border:1px solid var(--line)}
.stat{background:var(--paper); padding:22px 20px}
.stat b{display:block; font-family:"Archivo",system-ui,sans-serif; font-weight:800; font-size:30px; letter-spacing:-.03em; line-height:1.1}
.stat span{display:block; font-family:"Archivo",system-ui,sans-serif; font-size:12.5px; font-weight:500; color:var(--stone); margin-top:6px}

/* ---------- channels ---------- */
.chan{border-top:2px solid var(--ink); padding:26px 0; display:grid; grid-template-columns:230px 1fr 190px; gap:30px}
.chan:last-child{border-bottom:2px solid var(--ink)}
.chan-handle{font-family:"Archivo",system-ui,sans-serif; font-weight:800; font-size:19px; letter-spacing:-.02em; text-decoration:none; display:inline-block; overflow-wrap:anywhere}
.chan-handle:hover{box-shadow:inset 0 -3px 0 var(--signal)}
.chan-count{font-family:"Archivo",system-ui,sans-serif; font-weight:800; font-size:30px; letter-spacing:-.03em; line-height:1.1; margin-top:8px}
.chan-count span{display:block; font-size:12.5px; font-weight:500; color:var(--stone); letter-spacing:0}
.chan-what{margin:0 0 12px}
.chan-who{margin:0 0 12px; color:var(--stone); font-size:15.5px}
.chan-best{margin:0; font-size:15.5px}
.chan-best b{font-family:"Archivo",system-ui,sans-serif; font-size:12.5px; font-weight:700; display:block; color:var(--stone); letter-spacing:.04em; text-transform:uppercase}
.chan-fmt{font-family:"Archivo",system-ui,sans-serif; font-size:13.5px; line-height:1.75; color:var(--stone)}
.chan-fmt b{display:block; color:var(--ink); font-weight:700; margin-bottom:4px}
.chan-fmt .gap{display:block; height:12px}
@media (max-width:860px){ .chan{grid-template-columns:1fr; gap:14px} }

/* ---------- chips ---------- */
.chips{display:flex; flex-wrap:wrap; gap:9px}
.chip{
  font-family:"Archivo",system-ui,sans-serif; font-size:14px; font-weight:600;
  border:1.5px solid var(--ink); border-radius:999px; padding:7px 15px; background:transparent;
}
.chip.hot{background:var(--signal); border-color:var(--signal)}

/* ---------- packages ---------- */
.packs{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(290px,100%),1fr)); gap:18px}
.pack{border:2px solid var(--ink); border-radius:3px; padding:26px 24px; display:flex; flex-direction:column}
.pack.feature{background:var(--signal); border-color:var(--signal)}
.pack-tag{font-family:"Archivo",system-ui,sans-serif; font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--signal-deep); margin-bottom:10px}
.pack.feature .pack-tag{color:#4A3F10}
.pack h3{font-family:"Archivo",system-ui,sans-serif; font-size:20px; font-weight:800; letter-spacing:-.02em; margin:0 0 14px}
.pack-price{font-family:"Archivo",system-ui,sans-serif; font-weight:800; font-size:clamp(30px,4.6vw,40px); letter-spacing:-.035em; line-height:1; margin:0 0 4px}
.pack-unit{font-family:"Archivo",system-ui,sans-serif; font-size:13px; font-weight:500; color:var(--stone); margin:0 0 18px}
.pack.feature .pack-unit{color:#4A3F10}
.pack ul{margin:0 0 20px; padding-left:19px}
.pack li{font-size:15.5px; margin-bottom:6px}
.pack-foot{margin-top:auto; border-top:1.5px solid var(--ink); padding-top:12px; font-family:"Archivo",system-ui,sans-serif; font-size:13px; font-weight:500; color:var(--stone)}
.pack.feature .pack-foot{color:#4A3F10}
.pack-foot b{font-weight:700; color:var(--ink)}

.priceline{
  display:flex; flex-wrap:wrap; gap:8px 26px; align-items:baseline;
  background:var(--ink); color:var(--paper); padding:18px 24px; border-radius:3px; margin-top:22px;
  font-family:"Archivo",system-ui,sans-serif; font-size:14px; font-weight:500;
}
.priceline b{color:var(--signal); font-weight:700}

/* ---------- addons ---------- */
.deliv{border-top:1px solid var(--line); padding:20px 0; display:grid; grid-template-columns:260px 1fr 130px; gap:24px; align-items:baseline}
.deliv:last-child{border-bottom:1px solid var(--line)}
.deliv-name{font-family:"Archivo",system-ui,sans-serif; font-weight:700; font-size:17px}
.deliv-desc{margin:0; color:var(--stone); font-size:16px}
.deliv-rate{font-family:"Archivo",system-ui,sans-serif; font-weight:700; font-size:14px; text-align:right}
@media (max-width:760px){ .deliv{grid-template-columns:1fr; gap:6px} .deliv-rate{text-align:left} }

/* ---------- reels ---------- */
.reel-group{margin-bottom:38px}
.reel-group h3{font-family:"Archivo",system-ui,sans-serif; font-size:15px; font-weight:800; margin:0 0 14px; letter-spacing:-.01em}
.reel-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(188px,100%),1fr)); gap:14px}
.reel{
  display:block; text-decoration:none; background:var(--ink); color:var(--paper);
  aspect-ratio:9/13; padding:16px; position:relative; border-radius:3px; overflow:hidden;
}
.reel:nth-child(3n+2){background:#243028}
.reel:nth-child(4n+3){background:#3A2E1C}
.reel-title{font-family:"Archivo",system-ui,sans-serif; font-weight:700; font-size:16px; line-height:1.25; letter-spacing:-.01em}
.reel-note{font-size:14px; color:rgba(250,248,245,.62); margin-top:8px; line-height:1.4}
.reel-play{
  position:absolute; left:16px; bottom:14px; font-family:"Archivo",sans-serif;
  font-size:12.5px; font-weight:700; color:var(--signal);
}
.reel:hover .reel-play{text-decoration:underline}
.reel.empty{background:transparent; color:var(--stone); border:1.5px dashed var(--line); display:flex; align-items:center; justify-content:center; text-align:center; font-size:14px; padding:20px}

/* ---------- terms ---------- */
.terms{display:grid; grid-template-columns:1fr 1fr; gap:0 46px}
.term{border-top:1px solid var(--line); padding:16px 0}
.term h4{font-family:"Archivo",sans-serif; font-size:15px; font-weight:800; margin:0 0 4px}
.term p{margin:0; color:var(--stone); font-size:16px}
@media (max-width:760px){ .terms{grid-template-columns:1fr} }

.nos{margin:34px 0 0; padding-left:20px; color:var(--stone)}
.nos li{margin-bottom:7px}

/* ---------- buttons ---------- */
.btns{display:flex; flex-wrap:wrap; gap:12px; margin-top:30px}
.btn{
  font-family:"Archivo",system-ui,sans-serif; font-weight:700; font-size:15px;
  text-decoration:none; padding:13px 22px; border-radius:2px; border:2px solid var(--ink);
  background:var(--ink); color:var(--paper); display:inline-block;
}
.btn.alt{background:transparent; color:var(--ink)}

/* ---------- cross-link card ---------- */
.crosslink{
  display:block; text-decoration:none; border:2px solid var(--ink); border-radius:3px;
  padding:26px 28px; background:transparent;
}
.crosslink:hover{background:var(--signal); border-color:var(--signal)}
.crosslink .cl-tag{font-family:"Archivo",sans-serif; font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--signal-deep); margin-bottom:8px}
.crosslink:hover .cl-tag{color:#4A3F10}
.crosslink h3{font-family:"Archivo",sans-serif; font-size:clamp(20px,3vw,26px); font-weight:800; letter-spacing:-.02em; margin:0 0 8px}
.crosslink p{margin:0; color:var(--stone); max-width:60ch}
.crosslink:hover p{color:#4A3F10}

/* ---------- contact ---------- */
.contact-grid{display:grid; grid-template-columns:1.2fr 1fr; gap:40px; align-items:start}
.mailbox{font-family:"Archivo",sans-serif; font-weight:800; font-size:clamp(20px,3.4vw,30px); letter-spacing:-.025em; text-decoration:none; display:inline-block; word-break:break-all}
.mailbox:hover{box-shadow:inset 0 -4px 0 var(--signal)}
.mail-label{font-family:"Archivo",sans-serif; font-size:13px; font-weight:700; color:var(--stone); margin:0 0 4px}
.mail-row{margin-bottom:24px}
@media (max-width:760px){ .contact-grid{grid-template-columns:1fr; gap:26px} }

/* ---------- footer ---------- */
footer{background:var(--ink); color:rgba(250,248,245,.6); padding:30px 0; font-size:14px}
footer .wrap{display:flex; flex-wrap:wrap; gap:12px 26px; justify-content:space-between}
footer a{color:var(--signal); text-decoration:none}

/* ---------- responsive ---------- */
@media (max-width:860px){
  .wrap, .nav-in{padding:0 20px}
}
@media (max-width:700px){
  body{font-size:16px}
  .wrap, .nav-in{padding:0 18px}

  /* nav collapses into one scrollable row */
  .nav-in{height:54px; gap:14px}
  .nav-name{display:none}
  .nav-links{width:100%; min-width:0; gap:16px; overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none}
  .nav-links::-webkit-scrollbar{display:none}
  .nav a{white-space:nowrap}

  .hero{padding-top:44px}
  .hero h1{font-size:clamp(30px,10vw,52px); margin-bottom:20px; overflow-wrap:break-word}
  .hero-lede{margin-bottom:28px}
  .hero-meta{gap:2px 22px; font-size:13px}

  .sec{padding:44px 0}
  .sec-head{margin-bottom:24px}

  .why{gap:22px; margin-top:28px}
  .packs{grid-template-columns:1fr}
  .pack{padding:22px 20px}
  .priceline{flex-direction:column; gap:6px; padding:16px 18px}

  .reel-grid{grid-template-columns:1fr 1fr; gap:10px}
  .reel{padding:13px}
  .reel-title{font-size:15px}
  .reel-note{font-size:13px}
  .reel-play{left:13px; bottom:11px}

  .btns{gap:10px}
  .btn{flex:1 1 100%; text-align:center}
  .crosslink{padding:20px}
  footer .wrap{flex-direction:column; gap:6px}
}

@media (prefers-reduced-motion: no-preference){
  .hero-rule{animation:draw .7s cubic-bezier(.2,.7,.3,1) both}
  @keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
}
</style>
</head>
