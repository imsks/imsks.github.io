<style>
/* ---------- hero ---------- */
.hero{background:var(--signal); border-bottom:2px solid var(--ink); padding:70px 0 0}
.hero h1{font-size:clamp(36px,7.4vw,74px); font-weight:800; line-height:1; letter-spacing:-.04em; margin:0 0 26px; max-width:17ch}
.hero-lede{font-size:clamp(18px,2.3vw,23px); line-height:1.45; max-width:38ch; margin:0 0 38px; font-weight:600}
.hero .rule{margin-bottom:0}
.hero-meta{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}
.hero-meta div{padding:20px 16px 26px 0}
.hero-meta b{display:block; font-family:var(--display); font-weight:800; font-size:clamp(22px,3vw,30px); letter-spacing:-.04em; line-height:1}
.hero-meta span{display:block; margin-top:6px; font-family:var(--display); font-size:12.5px; font-weight:600; color:var(--signal-ink)}

/* ---------- audience ---------- */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr)); gap:1px; background:var(--line); border:1px solid var(--line)}
.stats .s{background:var(--paper); padding:22px 20px}
.stats b{display:block; font-family:var(--display); font-weight:800; font-size:30px; letter-spacing:-.03em; line-height:1.1}
.stats span{display:block; font-family:var(--display); font-size:12.5px; font-weight:500; color:var(--stone); margin-top:6px}
.why{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr)); gap:28px; margin-top:38px}
.why-item{border-top:2px solid var(--signal); padding-top:14px}
.why-item h3{font-family:var(--display); font-size:17px; font-weight:800; margin:0 0 6px}
.why-item p{margin:0; color:var(--stone); font-size:16px}

/* ---------- channels ---------- */
.chan{border-top:2px solid var(--ink); padding:26px 0; display:grid; grid-template-columns:230px 1fr 190px; gap:30px}
.chan:last-child{border-bottom:2px solid var(--ink)}
.chan-handle{font-family:var(--display); font-weight:800; font-size:19px; letter-spacing:-.02em; text-decoration:none; display:inline-block; overflow-wrap:anywhere}
.chan-handle:hover{box-shadow:inset 0 -3px 0 var(--signal)}
.chan-count{font-family:var(--display); font-weight:800; font-size:30px; letter-spacing:-.03em; line-height:1.1; margin-top:8px}
.chan-count span{display:block; font-size:12.5px; font-weight:500; color:var(--stone); letter-spacing:0}
.chan-what{margin:0 0 12px}
.chan-best{margin:0; font-size:15.5px}
.chan-best b{font-family:var(--display); font-size:12px; font-weight:700; display:block; color:var(--stone); letter-spacing:.06em; text-transform:uppercase}
.chan-fmt{font-family:var(--display); font-size:13.5px; line-height:1.75; color:var(--stone)}
.chan-fmt b{display:block; color:var(--ink); font-weight:700; margin-bottom:4px; font-size:12px; letter-spacing:.06em; text-transform:uppercase}
@media (max-width:860px){ .chan{grid-template-columns:1fr; gap:14px} }

/* ---------- packages ---------- */
.packs{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(290px,100%),1fr)); gap:18px}
.pack{border:2px solid var(--ink); border-radius:3px; padding:28px 26px; display:flex; flex-direction:column; transition:transform .3s var(--ease), box-shadow .3s var(--ease)}
.pack:hover{transform:translateY(-4px); box-shadow:var(--shadow)}
.pack.feature{background:var(--signal); border-color:var(--signal)}
.pack-tag{font-family:var(--display); font-size:11.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--signal-deep); margin-bottom:10px}
.pack.feature .pack-tag{color:var(--signal-ink)}
.pack h3{font-size:20px; font-weight:800; margin:0 0 14px}
.pack-price{font-family:var(--display); font-weight:800; font-size:clamp(30px,4.6vw,40px); letter-spacing:-.04em; line-height:1; margin:0 0 4px}
.pack-unit{font-family:var(--display); font-size:13px; font-weight:500; color:var(--stone); margin:0 0 18px}
.pack.feature .pack-unit{color:var(--signal-ink)}
.pack ul{margin:0 0 22px; padding-left:19px}
.pack li{font-size:15.5px; margin-bottom:6px}
.pack-foot{margin-top:auto; border-top:1.5px solid var(--ink); padding-top:12px; font-family:var(--display); font-size:13px; font-weight:500; color:var(--stone)}
.pack.feature .pack-foot{color:var(--signal-ink)}
.pack-foot b{font-weight:700; color:var(--ink)}

.priceline{
  display:flex; flex-wrap:wrap; gap:8px 28px; align-items:baseline;
  background:var(--ink); color:var(--paper); padding:20px 26px; border-radius:3px; margin-top:24px;
  font-family:var(--display); font-size:14px; font-weight:500;
}
.priceline b{color:var(--signal); font-weight:700}

/* ---------- add-ons ---------- */
.deliv{border-top:1px solid var(--line); padding:20px 0; display:grid; grid-template-columns:260px 1fr 130px; gap:24px; align-items:baseline}
.deliv:last-child{border-bottom:1px solid var(--line)}
.deliv-name{font-family:var(--display); font-weight:700; font-size:17px}
.deliv-desc{margin:0; color:var(--stone); font-size:16px}
.deliv-rate{font-family:var(--display); font-weight:700; font-size:14px; text-align:right}
@media (max-width:760px){ .deliv{grid-template-columns:1fr; gap:6px} .deliv-rate{text-align:left} }

/* ---------- reels ---------- */
.reel-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(188px,100%),1fr)); gap:14px}
.reel{
  display:block; text-decoration:none; background:var(--ink); color:var(--paper);
  aspect-ratio:9/13; padding:18px; position:relative; border-radius:3px; overflow:hidden;
  transition:transform .3s var(--ease), box-shadow .3s var(--ease);
}
.reel:nth-child(3n+2){background:#243028}
.reel:nth-child(4n+3){background:#3A2E1C}
.reel:hover{transform:translateY(-5px) rotate(-.6deg); box-shadow:var(--shadow)}
.reel-title{font-family:var(--display); font-weight:700; font-size:16px; line-height:1.25; letter-spacing:-.01em}
.reel-note{font-size:14px; color:rgba(250,248,245,.62); margin-top:8px; line-height:1.4}
.reel-play{position:absolute; left:18px; bottom:15px; font-family:var(--display); font-size:12.5px; font-weight:700; color:var(--signal)}
.reel:hover .reel-play{text-decoration:underline}

/* ---------- terms ---------- */
.terms{display:grid; grid-template-columns:1fr 1fr; gap:0 46px}
.term{border-top:1px solid var(--line); padding:16px 0}
.term h4{font-family:var(--display); font-size:15px; font-weight:800; margin:0 0 4px}
.term p{margin:0; color:var(--stone); font-size:16px}
@media (max-width:760px){ .terms{grid-template-columns:1fr} }
.nos{margin:34px 0 0; padding-left:20px; color:var(--stone)}
.nos li{margin-bottom:7px}

/* ---------- contact ---------- */
.contact-grid{display:grid; grid-template-columns:1.2fr 1fr; gap:40px; align-items:start}
.mailbox{font-family:var(--display); font-weight:800; font-size:clamp(20px,3.4vw,30px); letter-spacing:-.03em; text-decoration:none; display:inline-block; word-break:break-all}
.mailbox:hover{box-shadow:inset 0 -4px 0 var(--signal)}
.mail-label{font-family:var(--display); font-size:13px; font-weight:700; color:var(--stone); margin:0 0 4px}
@media (max-width:760px){ .contact-grid{grid-template-columns:1fr; gap:26px} }

@media (max-width:700px){
  .hero{padding-top:48px}
  .packs{grid-template-columns:1fr}
  .priceline{flex-direction:column; gap:6px}
  .reel-grid{grid-template-columns:1fr 1fr; gap:10px}
  .btn{flex:1 1 100%; justify-content:center}
}
</style>

      <div class="pack-tag">${esc(p.tag)}</div>
      <h3>${esc(p.title)}</h3>
      <p class="pack-price">${esc(p.price)}</p>
      <p class="pack-unit">${esc(p.unit)}</p>
      <ul>${p.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>
      <div class="pack-foot">${p.foot}</div>
    </div>`).join('');
  $('priceLine').innerHTML = CONFIG.priceLine.map(l => `<span>${l}</span>`).join('');

  $('addonList').innerHTML = CONFIG.addons.map(d => `
    <div class="deliv">
      <div class="deliv-name">${esc(d.name)}</div>
      <p class="deliv-desc">${esc(d.desc)}</p>
      <div class="deliv-rate">${esc(d.rate)}</div>
    </div>`).join('');

  $('categories').innerHTML = CONFIG.categories
    .map(c => `<span class="chip${c.hot ? ' hot' : ''}">${esc(c.label)}</span>`).join('');

  $('reelsIntro').textContent = CONFIG.reelsIntro;
  $('reelGrid').innerHTML = CONFIG.reels.map(r => `
    <a class="reel" href="${esc(r.url)}" target="_blank" rel="noopener">
      <div class="reel-title">${esc(r.title)}</div>
      <div class="reel-note">${esc(r.note)}</div>
      <div class="reel-play">Watch on Instagram</div>
    </a>`).join('');

  $('termList').innerHTML = CONFIG.terms
    .map(t => `<div class="term"><h4>${esc(t.q)}</h4><p>${esc(t.a)}</p></div>`).join('');
  $('termNos').innerHTML = CONFIG.termNos.map(n => `<li>${esc(n)}</li>`).join('');

  $('contactIntro').textContent = CONFIG.contactIntro;
  const brandLink = mailto(CONFIG.mailTemplates.brand);
  $('btnBrand').href = brandLink;
  $('mailBrand').href = brandLink;
  $('mailBrand').textContent = CONFIG.email;
  $('btnMediaKit').href = mailto(CONFIG.mailTemplates.mediaKit);

  $('links').innerHTML = CONFIG.links
    .map(l => `<a class="chip" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('');

  $('crossLink').href = CONFIG.crossLink.url;
  $('clTag').textContent = CONFIG.crossLink.tag;
  $('clTitle').textContent = CONFIG.crossLink.title;
  $('clBody').textContent = CONFIG.crossLink.body;

  U.observe();
})();
</script>
</body>
</html>
